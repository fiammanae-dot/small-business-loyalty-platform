name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Install, test, lint, typecheck, build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      SESSION_SECRET: "ci-only-session-secret-not-for-production-use"
      NODE_ENV: "test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check (strict)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
