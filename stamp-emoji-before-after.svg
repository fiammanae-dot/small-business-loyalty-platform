<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#f8fafc"/>
  <style>
    .title{font:800 28px Arial,sans-serif;fill:#111827}
    .sub{font:500 16px Arial,sans-serif;fill:#64748b}
    .label{font:900 12px Arial,sans-serif;letter-spacing:2px;fill:#64748b}
    .card{fill:#fff;stroke:#e5e7eb;stroke-width:1}
    .slot{fill:#fff;stroke:#e5e7eb;stroke-width:1;filter:url(#shadow)}
    .emoji{font:400 34px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
    .small{font:800 15px Arial,sans-serif;fill:#111827}
    .muted{font:700 14px Arial,sans-serif;fill:#64748b}
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect class="card" x="70" y="70" width="500" height="540" rx="28"/>
  <text class="title" x="110" y="125">Before</text>
  <text class="sub" x="110" y="153">Outline SVG stamp symbols</text>
  <text class="label" x="110" y="205">CUSTOMER CARD STAMPS</text>
  <g transform="translate(110 230)">
    <g fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linejoin="round">
      <g transform="translate(0 0)"><circle class="slot" cx="24" cy="24" r="24"/><path transform="translate(8 8)" d="M16 1l4.2 8.5 9.4 1.4-6.8 6.6 1.6 9.4L16 22.5 7.6 26.9l1.6-9.4-6.8-6.6 9.4-1.4z"/></g>
      <g transform="translate(64 0)"><circle class="slot" cx="24" cy="24" r="24"/><path transform="translate(8 8)" d="M16 1l4.2 8.5 9.4 1.4-6.8 6.6 1.6 9.4L16 22.5 7.6 26.9l1.6-9.4-6.8-6.6 9.4-1.4z"/></g>
      <g transform="translate(128 0)"><circle class="slot" cx="24" cy="24" r="24"/><path transform="translate(8 8)" d="M16 1l4.2 8.5 9.4 1.4-6.8 6.6 1.6 9.4L16 22.5 7.6 26.9l1.6-9.4-6.8-6.6 9.4-1.4z"/></g>
      <g transform="translate(192 0)"><circle class="slot" cx="24" cy="24" r="24"/><path transform="translate(8 8)" d="M16 1l4.2 8.5 9.4 1.4-6.8 6.6 1.6 9.4L16 22.5 7.6 26.9l1.6-9.4-6.8-6.6 9.4-1.4z"/></g>
      <g opacity=".3" transform="translate(256 0)"><circle class="slot" cx="24" cy="24" r="24"/><path transform="translate(8 8)" d="M16 1l4.2 8.5 9.4 1.4-6.8 6.6 1.6 9.4L16 22.5 7.6 26.9l1.6-9.4-6.8-6.6 9.4-1.4z"/></g>
    </g>
  </g>
  <rect class="card" x="630" y="70" width="500" height="540" rx="28"/>
  <text class="title" x="670" y="125">After</text>
  <text class="sub" x="670" y="153">Native emoji stamp symbols</text>
  <text class="label" x="670" y="205">CUSTOMER CARD STAMPS</text>
  <g transform="translate(670 230)">
    <circle class="slot" cx="24" cy="24" r="24"/><text class="emoji" x="24" y="36" text-anchor="middle">☕</text>
    <circle class="slot" cx="88" cy="24" r="24"/><text class="emoji" x="88" y="36" text-anchor="middle">☕</text>
    <circle class="slot" cx="152" cy="24" r="24"/><text class="emoji" x="152" y="36" text-anchor="middle">☕</text>
    <circle class="slot" cx="216" cy="24" r="24"/><text class="emoji" x="216" y="36" text-anchor="middle">☕</text>
    <g opacity=".3"><circle class="slot" cx="280" cy="24" r="24"/><text class="emoji" x="280" y="36" text-anchor="middle">☕</text></g>
  </g>
  <text class="label" x="670" y="340">STAMP DESIGN PICKER</text>
  <text class="muted" x="670" y="370">Recommended emoji appear first.</text>
  <g transform="translate(670 392)">
    <rect x="0" y="0" width="52" height="52" rx="16" fill="#fff" stroke="#e5e7eb"/><text class="emoji" x="26" y="37" text-anchor="middle">⭐</text>
    <rect x="62" y="0" width="52" height="52" rx="16" fill="#fff" stroke="#e5e7eb"/><text class="emoji" x="88" y="37" text-anchor="middle">❤️</text>
    <rect x="124" y="0" width="52" height="52" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="3"/><text class="emoji" x="150" y="37" text-anchor="middle">☕</text>
    <rect x="186" y="0" width="52" height="52" rx="16" fill="#fff" stroke="#e5e7eb"/><text class="emoji" x="212" y="37" text-anchor="middle">✂️</text>
    <rect x="248" y="0" width="52" height="52" rx="16" fill="#fff" stroke="#e5e7eb"/><text class="emoji" x="274" y="37" text-anchor="middle">💄</text>
    <rect x="310" y="0" width="52" height="52" rx="16" fill="#fff" stroke="#e5e7eb"/><text class="emoji" x="336" y="37" text-anchor="middle">🚗</text>
    <rect x="0" y="70" width="320" height="58" rx="18" fill="#fff" stroke="#e5e7eb"/>
    <text class="muted" x="22" y="105">Selected:</text>
    <text class="emoji" x="118" y="108">☕</text>
    <text class="small" x="164" y="105">Coffee Cup</text>
  </g>
</svg>
